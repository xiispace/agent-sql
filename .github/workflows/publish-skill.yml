name: Publish skill

on:
  push:
    tags: ['v*', 'skill-v*']

jobs:
  publish-skill:
    if: github.repository_owner == 'shhac'
    uses: shhac/agent-skills/.github/workflows/sync-skill.yml@main
    with:
      skill_name: agent-sql
      # House budget: well under Codex's 1024 cap, so descriptions
      # cannot creep back up and crowd out every other installed skill.
      max_description_chars: 650
    secrets:
      SKILLS_DEPLOY_KEY: ${{ secrets.SKILLS_DEPLOY_KEY }}
